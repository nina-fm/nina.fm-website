# Prod du site (website#80) : https://www.nina.fm, derrière le reverse proxy de
# nina.fm-webserver. Déployé par deploy.yml dans /var/nina/website/deploy/, sous le nom
# docker-compose.astro.yml : le docker-compose.yml du dossier est encore celui du Nuxt,
# jusqu'à son arrêt.
#
# L'image officielle sert les fichiers construits sur le runner : aucune image construite,
# aucun processus Node, quelques Mo de mémoire sur un serveur à 1 vCPU / 2 Go.
# Seul site/ est monté : ni le .env du Nuxt ni deploy/ ne sont servis. nginx sert
# `current`, lien vers la dernière version de `releases/` : un lien basculé d'un coup ne
# laisse jamais une moitié de site.

# Nom de projet explicite : sans lui, Compose le tire du dossier `deploy`, comme pour le
# compose du Nuxt. Les deux stacks se verraient l'une l'autre en orphelines, et un
# `--remove-orphans` supprimerait l'autre conteneur.
name: nina-website-astro

services:
  website-astro:
    image: nginx:1.30-alpine
    container_name: nina-website-astro
    restart: unless-stopped
    labels:
      - diun.enable=false
    # Ni base ni service à joindre : le pont par défaut, plutôt que nina-network où chaque
    # nom de service devient un alias partagé par toutes les stacks.
    network_mode: bridge
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    volumes:
      - /var/nina/website/site:/srv:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # 3000 est le Nuxt, 3002 nina-faceb : www.nina.fm.conf déclare website_astro sur 3003.
    ports:
      - '127.0.0.1:3003:80'
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 64M
    # wget de busybox, 127.0.0.1 et non localhost (que busybox résout en ::1), intervalle
    # long : Docker ne redémarre pas un conteneur unhealthy, le statut ne sert qu'au
    # diagnostic ; start_interval garde une détection rapide au démarrage.
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', '-T', '3', 'http://127.0.0.1/']
      interval: 2m
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
