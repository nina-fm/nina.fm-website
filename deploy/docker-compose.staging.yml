# Staging du site Astro (website#76) : https://staging.nina.fm, derrière le reverse proxy
# de nina.fm-webserver. Déployé dans /var/nina/website-staging/deploy/ par deploy-staging.yml (deploy-static.yml).
#
# L'image officielle sert les fichiers construits sur le runner : aucune image construite,
# aucun processus Node, quelques Mo de mémoire sur un serveur à 1 vCPU / 2 Go.
# Tout le dossier est monté, et nginx sert `current`, lien vers la dernière version de
# `releases/` : un lien basculé d'un coup ne laisse jamais une moitié de site, quand un bind
# mount du dossier servi resterait attaché à l'ancienne version après un `mv`.

# Nom de projet explicite : sans lui, Compose le tire du dossier `deploy`, celui du compose
# de la prod (/var/nina/website/deploy). Les deux stacks se verraient l'une l'autre en
# orphelines, et un `--remove-orphans` supprimerait le conteneur de la prod.
name: nina-website-staging

services:
  website-staging:
    image: nginx:1.30-alpine
    container_name: nina-website-staging
    restart: unless-stopped
    labels:
      - diun.enable=false
    # Ni base ni service à joindre : le pont par défaut, plutôt que nina-network où chaque
    # nom de service devient un alias partagé par toutes les stacks.
    network_mode: bridge
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    volumes:
      - /var/nina/website-staging:/srv:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '127.0.0.1:3001:80'
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 32M
    # wget de busybox, 127.0.0.1 et non localhost (que busybox résout en ::1), intervalle long :
    # mêmes raisons que docker-compose.production.yml.
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', '-T', '3', 'http://127.0.0.1/']
      interval: 2m
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s
    logging:
      driver: json-file
      options:
        max-size: '5m'
        max-file: '2'
