# Sert le site statique du staging (website#76). TLS, limites de débit et cache long des
# assets sont au reverse proxy (nina.fm-webserver, staging.nina.fm.conf).
server {
    listen 80;
    server_name _;

    root /srv/current;
    index index.html;

    # Un staging n'est jamais indexable : posé ici aussi, pour que le conteneur reste fermé
    # aux moteurs même joint sans le reverse proxy. Un add_header dans une location annule
    # celui-ci : chacune le répète (check-indexing.ts le vérifie en ligne).
    add_header X-Robots-Tag "noindex, nofollow" always;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/plain;

    # Pages d'Astro : /page → page/index.html ou page.html. Pages et sw.js toujours
    # revalidés : sans Cache-Control, Safari garde une page ancienne de lui-même, dont les
    # fichiers de _astro/ peuvent avoir disparu (website#87).
    location / {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html $uri.html =404;
    }

    # Noms à hash de contenu, en cache long au reverse proxy : rien ici. Ceux des builds
    # des 30 derniers jours y restent (deploy-static.yml), pour une page ancienne encore
    # ouverte ou gardée par un service worker.
    location /_astro/ {
        try_files $uri =404;
    }

    # Le mime.types de nginx ne connaît pas .webmanifest.
    location ~ \.webmanifest$ {
        types { }
        default_type application/manifest+json;
    }

    access_log off;
}
