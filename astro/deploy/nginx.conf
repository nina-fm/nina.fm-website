# Sert le site statique du staging (website#76). TLS, limites de débit et cache long des
# assets sont au reverse proxy (nina.fm-webserver, staging.nina.fm.conf).
server {
    listen 80;
    server_name _;

    root /srv/current;
    index index.html;

    # Un staging n'est jamais indexable : posé ici aussi, pour que le conteneur reste fermé
    # aux moteurs même joint sans le reverse proxy. Aucun add_header dans les location,
    # qui annuleraient celui-ci.
    add_header X-Robots-Tag "noindex, nofollow" always;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/plain;

    # Pages d'Astro : /page → page/index.html ou page.html.
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    # Le mime.types de nginx ne connaît pas .webmanifest.
    location ~ \.webmanifest$ {
        types { }
        default_type application/manifest+json;
    }

    access_log off;
}
