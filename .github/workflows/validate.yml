name: Validate

# Configuration qualité du repo, définie **une seule fois** et appelée par
# `ci.yml` (pull requests) comme par `deploy.yml` (garde avant déploiement).
# Deux jeux d'entrées séparés finiraient par diverger et produiraient des
# verdicts contradictoires entre une PR et `main`.
#
# Les étapes elles-mêmes vivent dans `node-validate.yml` au niveau workspace.
# Même motif que `nina.fm-api` et `nina.fm-faceb`.
#
# Seul `CODECOV_TOKEN` est accepté, et transmis nommément : pas de
# `secrets: inherit`, qui ferait descendre jusqu'ici les secrets de déploiement.
# `deploy.yml` le fournit, `ci.yml` non. L'envoi Codecov est gardé par
# `github.ref == refs/heads/main` : sauté sur une PR ; sauté aussi, avec un
# `::notice::`, si `ci.yml` est lancé à la main sur `main`, faute de jeton.

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false

jobs:
  quality:
    uses: nina-fm/nina.fm-apps-workspace/.github/workflows/node-validate.yml@main
    with:
      node-version: '22'
      type-check: true
      lint-strict: false
      codecov-enabled: true
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
