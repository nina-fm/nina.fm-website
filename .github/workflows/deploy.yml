name: Deploy Prod

# Déploiement uniquement. La validation des pull requests vit dans `ci.yml`,
# qui tourne sans secret ni droit d'écriture. Le job `quality` est conservé ici
# comme garde avant déploiement.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      no-cache:
        description: 'Rebuild Docker image without cache'
        type: boolean
        default: false

env:
  HUSKY: '0'

jobs:
  # Même configuration que la CI des pull requests, définie une seule fois.
  # Rejouée ici parce que le merge en squash produit sur `main` un commit qui
  # n'a jamais existé sous cette forme, donc jamais été testé tel quel.
  quality:
    uses: ./.github/workflows/validate.yml
    secrets: inherit

  versioning:
    needs: quality
    permissions:
      contents: write
    uses: nina-fm/nina.fm-apps-workspace/.github/workflows/release.yml@main
    with:
      skip-ci: true
    secrets: inherit

  # Image, labels OCI, cache de registre et GitHub Release, communs aux apps.
  # La release y est non bloquante : un échec des notes ne saute plus `deploy`.
  build:
    needs: versioning
    permissions:
      contents: write
      packages: write
    uses: nina-fm/nina.fm-apps-workspace/.github/workflows/build-release.yml@main
    with:
      version: ${{ needs.versioning.outputs.version }}
      has-release: ${{ needs.versioning.outputs.has_release == 'true' }}
      # `inputs` est nul sur un `push` : sans repli, l'entrée booléenne recevrait une chaîne vide.
      no-cache: ${{ inputs.no-cache || false }}
      target: production
      build-args: |
        NUXT_PUBLIC_AUDIO_STREAM_URL=${{ vars.NUXT_PUBLIC_AUDIO_STREAM_URL }}
        NUXT_PUBLIC_API_URL=${{ vars.NUXT_PUBLIC_API_URL }}
        NUXT_PUBLIC_API_STREAM_ENDPOINT=${{ vars.NUXT_PUBLIC_API_STREAM_ENDPOINT }}
      image-title: Nina.fm Website
      image-description: Site officiel de la webradio artisanale Nina.fm

  deploy:
    needs: [versioning, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read

    steps:
      - name: Pull Docker image
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 15m
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "📥 Pulling image..."
            for i in 1 2 3; do
              if docker pull ${{ needs.build.outputs.image }}:latest; then
                echo "✅ Pull successful"
                exit 0
              else
                echo "⚠️ Pull attempt $i failed, retrying..."
                sleep 5
              fi
            done
            echo "❌ Pull failed after 3 attempts"
            exit 1

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            mkdir -p /var/nina/website/deploy

            cat > /var/nina/website/.env << EOF
            DOCKER_IMAGE=${{ needs.build.outputs.image }}
            NODE_ENV=production
            PORT=3000
            HOST=0.0.0.0
            NUXT_PUBLIC_AUDIO_STREAM_URL=${{ vars.NUXT_PUBLIC_AUDIO_STREAM_URL }}
            NUXT_PUBLIC_API_URL=${{ vars.NUXT_PUBLIC_API_URL }}
            NUXT_PUBLIC_API_STREAM_ENDPOINT=${{ vars.NUXT_PUBLIC_API_STREAM_ENDPOINT }}
            EOF
            chmod 600 /var/nina/website/.env

            cd /var/nina/website/deploy
            docker network create nina-network 2>/dev/null || echo "Réseau nina-network existe déjà"

            docker stop nina-website 2>/dev/null || echo "Aucun conteneur nina-website à arrêter"
            docker rm nina-website 2>/dev/null || echo "Aucun conteneur nina-website à supprimer"

            curl -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                 -H "Accept: application/vnd.github.v3.raw" \
                 -o docker-compose.yml \
                 "https://api.github.com/repos/${{ github.repository }}/contents/docker-compose.yml"

            docker compose --env-file /var/nina/website/.env up -d --force-recreate

            echo "🔍 Health check..."
            HEALTH_CHECK_RETRIES=12
            for i in $(seq 1 $HEALTH_CHECK_RETRIES); do
              if curl -sf http://localhost:3000/ > /dev/null 2>&1; then
                echo "✅ Déploiement réussi - Website opérationnel"
                docker logs nina-website --tail 20
                break
              else
                echo "⏳ Tentative $i/$HEALTH_CHECK_RETRIES - Website pas encore prêt..."
                if [ $i -eq $HEALTH_CHECK_RETRIES ]; then
                  echo "❌ Échec du déploiement - Website non accessible après $HEALTH_CHECK_RETRIES tentatives"
                  docker logs nina-website --tail 50
                  exit 1
                fi
                sleep 5
              fi
            done

  post-deploy:
    needs: deploy
    if: always() && needs.deploy.result != 'skipped'
    uses: nina-fm/nina.fm-apps-workspace/.github/workflows/cleanup.yml@main
    with:
      image-name: ghcr.io/${{ github.repository }}
    secrets: inherit
