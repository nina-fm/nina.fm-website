name: Deploy Prod

# Déploiement de la prod à chaque push sur `main`. La validation des pull requests vit
# dans `ci.yml`, qui tourne sans secret ni droit d'écriture ; elle est rejouée ici parce
# que le merge en squash produit sur `main` un commit jamais testé tel quel.
#
# Le site statique est déployé par `deploy-static.yml`, comme le staging, dans
# /var/nina/website/site, servi par le conteneur nina-website-astro sur le port 3003,
# vers lequel le reverse proxy envoie www.nina.fm (nina.fm-webserver).

on:
  push:
    branches: [main]
    # Les consignes de l'agent ne changent pas le site : le merge de #83 a relancé la prod.
    paths-ignore:
      - '.claude/**'
  workflow_dispatch:

env:
  HUSKY: '0'

# Deux déploiements ne se croisent jamais sur le serveur ; le suivant attend.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  # En lecture seule, et avec le seul `CODECOV_TOKEN`.
  validate:
    permissions:
      contents: read
    uses: ./.github/workflows/validate.yml
    with:
      site-env: production
      upload-dist: true
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Aucun secret : `release.yml` pousse son commit de version avec `GITHUB_TOKEN`.
  versioning:
    needs: validate
    permissions:
      contents: write
    uses: nina-fm/nina.fm-apps-workspace/.github/workflows/release.yml@main
    with:
      skip-ci: true

  # Les notes de release ne conditionnent pas la mise en prod : job séparé, non bloquant.
  release:
    needs: versioning
    if: needs.versioning.outputs.has_release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout du tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.versioning.outputs.version }}
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Create GitHub Release
        id: release
        continue-on-error: true
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ needs.versioning.outputs.version }}
          name: Release ${{ needs.versioning.outputs.version }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `continue-on-error` laisse le run vert : sans cette trace, rien ne dirait que la
      # release manque. Le tag est publié de toute façon, elle se recrée à la main.
      - name: Signaler une release manquée
        if: steps.release.outcome == 'failure'
        env:
          VERSION: ${{ needs.versioning.outputs.version }}
        run: echo "::warning::Release $VERSION non créée — le tag est publié, la release se recrée à la main"

  # Le Nuxt, remplacé par Astro (website#80) : conteneur, image, compose et .env.
  # Sans effet une fois fait ; à retirer au prochain passage dans ce workflow.
  retire-nuxt:
    needs: versioning
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Retirer le Nuxt du serveur
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 2m
          script: |
            set -eu
            cd /var/nina/website
            if docker inspect nina-website >/dev/null 2>&1; then
              docker stop nina-website
              docker rm nina-website
              echo "🗑️ Conteneur nina-website retiré"
            fi
            docker images -q ghcr.io/nina-fm/nina.fm-website | sort -u | xargs -r docker image rm
            # Le compose du Nuxt seul, reconnu à son image : celui d'Astro prend sa place.
            if grep -qs 'DOCKER_IMAGE' deploy/docker-compose.yml; then rm deploy/docker-compose.yml; fi
            rm -f .env deploy/docker-compose.astro.yml
            ls -A . deploy

  deploy:
    needs: retire-nuxt
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-static.yml
    with:
      environment: production
      base-dir: /var/nina/website
      site-subdir: site
      container: nina-website-astro
      port: 3003
      public-url: https://www.nina.fm
      indexing: indexable
    secrets:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
