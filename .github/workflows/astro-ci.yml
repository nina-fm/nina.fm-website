name: Astro CI

# Validation des pull requests qui touchent le site Astro (`astro/`). Sans secret ni
# droit d'écriture, comme `ci.yml` pour le site Nuxt.

on:
  pull_request:
    paths:
      - 'astro/**'
      - '.github/workflows/astro-*.yml'
      - '.github/workflows/deploy-staging.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astro-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/astro-validate.yml
