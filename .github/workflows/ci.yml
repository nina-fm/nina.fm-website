name: CI

# Validation des pull requests. Séparée de `deploy.yml` par déclencheur et par
# privilège : elle n'a besoin ni d'écrire, ni des secrets de déploiement. Aucun secret
# n'est passé à `validate.yml`.
#
# La configuration qualité elle-même est dans `validate.yml`, partagée avec les
# déploiements, pour qu'une PR et `main` ne puissent pas rendre des verdicts différents.
# Le build de la PR est celui de la prod : c'est lui qui part en ligne au merge.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Un push sur une PR annule la validation en cours : seul le dernier état compte.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
