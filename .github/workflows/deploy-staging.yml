name: Deploy Staging

# Déploie le site sur https://staging.nina.fm à chaque push sur `main` (website#76), par
# `deploy-static.yml`, dans /var/nina/website-staging. Ni version ni release : c'est le
# travail de `deploy.yml`.
#
# Un staging n'est jamais indexable : le build est vérifié avant la copie (validate.yml),
# le conteneur et le site en ligne après, en-tête X-Robots-Tag compris.

on:
  push:
    branches: [main]
    # Les consignes de l'agent ne changent pas le site : le merge de #83 a relancé la prod.
    paths-ignore:
      - '.claude/**'
  workflow_dispatch:

permissions:
  contents: read

# Deux déploiements ne se croisent jamais sur le serveur ; le suivant attend.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    with:
      site-env: staging
      upload-dist: true

  deploy:
    needs: validate
    uses: ./.github/workflows/deploy-static.yml
    with:
      environment: staging
      base-dir: /var/nina/website-staging
      container: nina-website-staging
      port: 3001
      public-url: https://staging.nina.fm
      indexing: noindex
    secrets:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
