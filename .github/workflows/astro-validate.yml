name: Astro Validate

# Configuration qualité du site Astro (`astro/`, epic #75), définie une seule fois et
# appelée par `astro-ci.yml` (pull requests) comme par `deploy-staging.yml` (garde avant
# déploiement). `node-validate.yml` du workspace ne sait pas travailler dans un
# sous-dossier : ces étapes vivent ici tant qu'`astro/` n'est pas à la racine (#80).
#
# Le build sort en staging : non indexable (voir astro/src/shared/site/indexing.ts), ce
# que `check:noindex` vérifie avant que l'artefact puisse partir sur le serveur.

on:
  workflow_call:
    inputs:
      upload-dist:
        description: "Publier dist/ en artefact pour un déploiement"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      HUSKY: '0'
    defaults:
      run:
        working-directory: astro
    steps:
      # astro/ seul : le projet doit se construire sans la racine Nuxt. Au build, rolldown
      # remonte jusqu'au tsconfig de la racine, qui étend un .nuxt/ absent tant que
      # `nuxt prepare` n'a pas tourné (`Tsconfig not found`, PR #82).
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: astro/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: astro/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: astro/.nvmrc
          cache: pnpm
          cache-dependency-path: astro/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm type-check

      - name: Tests
        run: pnpm test

      # Même flux et même API que la prod : les variables NUXT_PUBLIC_* du repo.
      - name: Build (staging)
        env:
          PUBLIC_SITE_ENV: staging
          PUBLIC_AUDIO_STREAM_URL: ${{ vars.NUXT_PUBLIC_AUDIO_STREAM_URL }}
          PUBLIC_API_URL: ${{ vars.NUXT_PUBLIC_API_URL }}
          PUBLIC_API_STREAM_ENDPOINT: ${{ vars.NUXT_PUBLIC_API_STREAM_ENDPOINT }}
        run: pnpm build

      - name: Budget de performance
        run: pnpm perf:budget

      # Un staging n'est jamais indexable : un build qui le serait ne part pas.
      - name: Non-indexation du build
        run: pnpm check:noindex

      - name: Publier dist/
        if: inputs.upload-dist
        uses: actions/upload-artifact@v7
        with:
          name: astro-dist
          path: astro/dist/
          retention-days: 3
          if-no-files-found: error
