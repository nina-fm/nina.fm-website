services:
  website:
    image: ${DOCKER_IMAGE}:latest
    container_name: nina-website
    restart: unless-stopped
    labels:
      - diun.enable=false
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - NUXT_PUBLIC_AUDIO_STREAM_URL=${NUXT_PUBLIC_AUDIO_STREAM_URL}
      - NUXT_PUBLIC_API_URL=${NUXT_PUBLIC_API_URL}
      - NUXT_PUBLIC_API_STREAM_ENDPOINT=${NUXT_PUBLIC_API_STREAM_ENDPOINT}

    ports:
      - "127.0.0.1:3000:3000"

    networks:
      - nina-network

    # wget de busybox plutôt que `node -e` : chaque vérification coûtait ~100 ms de CPU
    # (démarrage de Node) sur un serveur à 1 vCPU, contre ~30 ms. 127.0.0.1 et non
    # localhost, que busybox résout en ::1 alors que l'app n'écoute qu'en IPv4.
    # Intervalle long : Docker ne redémarre pas un conteneur unhealthy, le statut ne sert
    # qu'au diagnostic ; start_interval garde une détection rapide au démarrage.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "-T", "3", "http://127.0.0.1:3000/"]
      interval: 2m
      timeout: 5s
      retries: 3
      start_period: 40s
      start_interval: 2s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  nina-network:
    name: nina-network
    external: true
